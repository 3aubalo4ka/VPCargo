services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: vpcargo
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/vpcargo.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASS: root
      DB_NAME: vpcargo
      SESSION_SECRET: vpcargo-super-secret
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
